<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo C · 区块转场 + 动态背景</title>
<style>
  :root {
    --text:#e6e8f0; --text-2:#9aa0b5; --border:rgba(255,255,255,.1);
    --indigo:#6366f1; --cyan:#22d3ee; --purple:#a855f7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text); overflow-x:hidden; position:relative;
  }

  /* ===== 固定流动渐变背景 ===== */
  .flow-bg {
    position:fixed; inset:0; z-index:-2;
    background:linear-gradient(125deg,#0e1124,#1b1140,#0f2b3a,#0e1124);
    background-size:400% 400%;
    animation:flow 20s ease-in-out infinite;
  }
  @keyframes flow {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  /* 光斑叠加层 */
  .glow {
    position:fixed; inset:0; z-index:-1; pointer-events:none; filter:blur(100px); opacity:.5;
  }
  .glow i { position:absolute; border-radius:50%; animation:drift 24s ease-in-out infinite; }
  .glow i:nth-child(1){ width:420px; height:420px; background:var(--indigo); top:-80px; left:-60px; }
  .glow i:nth-child(2){ width:380px; height:380px; background:var(--cyan); bottom:-120px; right:-60px; animation-delay:-8s; }
  .glow i:nth-child(3){ width:320px; height:320px; background:var(--purple); top:40%; left:55%; animation-delay:-15s; }
  @keyframes drift {
    0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(90px,-70px) scale(1.2)}
  }

  /* ===== 区块转场 ===== */
  .block {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:80px 24px;
  }
  .block .card {
    max-width:680px; width:100%;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:28px;
    padding:64px 48px;
    text-align:center;
    backdrop-filter:blur(14px);
    box-shadow:0 30px 80px rgba(0,0,0,.35);

    opacity:0;
    transform:translateY(80px) scale(.92);
    transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .block.in .card { opacity:1; transform:none; }

  /* 不同区块用不同入场方向 */
  .block.left .card { transform:translateX(-120px); }
  .block.left.in .card { transform:none; }
  .block.right .card { transform:translateX(120px); }
  .block.right.in .card { transform:none; }

  .block .idx { font-size:.78rem; letter-spacing:5px; color:var(--cyan); margin-bottom:22px; }
  .block h2 { font-size:2.2rem; font-weight:800; margin-bottom:18px; }
  .block p { color:var(--text-2); line-height:2; font-size:1.02rem; }
  .block .divider { width:60px; height:3px; margin:26px auto; border-radius:2px; background:linear-gradient(90deg,var(--indigo),var(--cyan)); }

  header { text-align:center; padding:160px 24px 40px; }
  header h1 { font-size:2.6rem; font-weight:800; margin-bottom:12px; }
  header p { color:var(--text-2); }

  footer { text-align:center; padding:60px 24px; color:var(--text-2); font-size:.85rem; }

  @media (max-width:768px){
    .block .card{padding:44px 26px} header h1{font-size:1.9rem}
  }

  @media (prefers-reduced-motion: reduce){
    .flow-bg,.glow i{animation:none}
    .block .card{transition:none; opacity:1; transform:none}
    *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="flow-bg"></div>
<div class="glow"><i></i><i></i><i></i></div>

<header>
  <h1>区块转场 + 动态背景</h1>
  <p>滚动页面：每个区块独立淡入转场，背景渐变持续流动</p>
</header>

<section class="block center" data-c>
  <div class="card">
    <div class="idx">01 / 03</div>
    <div class="divider"></div>
    <h2>区块整体转场</h2>
    <p>当区块进入视口中央时，整块卡片淡入、上移、放大。离开视口后回到隐藏状态，来回滚动可反复看到转场。</p>
  </div>
</section>

<section class="block left" data-c>
  <div class="card">
    <div class="idx">02 / 03</div>
    <div class="divider"></div>
    <h2>左向滑入</h2>
    <p>不同区块可以设定不同的入场方向——这一块从左侧滑入，增强每块内容的独特感与叙事节奏。</p>
  </div>
</section>

<section class="block right" data-c>
  <div class="card">
    <div class="idx">03 / 03</div>
    <div class="divider"></div>
    <h2>右向滑入 + 流动背景</h2>
    <p>背景层的渐变色彩持续缓慢流动，光斑也在漂移，页面永不静止，但正文仍清晰可读、不被干扰。</p>
  </div>
</section>

<footer>Demo C · 区块转场 + 动态背景</footer>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const blocks = document.querySelectorAll('[data-c]');
  const o = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting) en.target.classList.add('in');
      else en.target.classList.remove('in');
    });
  }, { threshold: 0.45 });
  blocks.forEach(function(b){ o.observe(b); });

  if(reduce){ blocks.forEach(function(b){ b.classList.add('in'); }); }
})();
</script>
</body>
</html>
