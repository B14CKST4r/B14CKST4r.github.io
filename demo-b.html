<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo B · 全屏逐屏切换</title>
<style>
  :root {
    --text:#e6e8f0; --text-2:#9aa0b5; --border:rgba(255,255,255,.12); --indigo:#6366f1; --cyan:#22d3ee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:#0b0d17; color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  /* ===== 屏容器 ===== */
  .stage { height:100vh; position:relative; }
  .slides { height:100%; display:flex; will-change:transform; transition:transform .8s cubic-bezier(.7,0,.3,1); }
  .slide {
    min-width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 40px; position:relative; overflow:hidden;
  }

  /* 每屏独立背景色 + 装饰 */
  .s1 { background:linear-gradient(135deg,#10142b,#0b0d17 65%); }
  .s2 { background:linear-gradient(135deg,#0f2130,#0b0d17 65%); }
  .s3 { background:linear-gradient(135deg,#1d1233,#0b0d17 65%); }
  .s4 { background:linear-gradient(135deg,#1a0f20,#0b0d17 65%); }
  .s5 { background:linear-gradient(135deg,#101426,#0b0d17 65%); }

  .slide::before {
    content:""; position:absolute; width:420px; height:420px; border-radius:50%;
    filter:blur(110px); opacity:.35; pointer-events:none;
  }
  .s1::before { background:var(--indigo); top:-120px; right:-100px; }
  .s2::before { background:var(--cyan); bottom:-140px; left:-80px; }
  .s3::before { background:#a855f7; top:-80px; left:10%; }
  .s4::before { background:#f472b6; bottom:-120px; right:8%; }
  .s5::before { background:var(--indigo); top:50%; left:-160px; }

  .slide .num {
    font-size:7rem; font-weight:900; line-height:1; opacity:.12;
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none;
  }
  .slide .tag { font-size:.8rem; letter-spacing:4px; color:var(--cyan); margin-bottom:20px; }
  .slide h2 { font-size:3.2rem; font-weight:800; margin-bottom:20px; }
  .slide p { color:var(--text-2); max-width:520px; font-size:1.05rem; line-height:1.8; }

  /* ===== 控制按钮 ===== */
  .nav-btn {
    position:absolute; top:50%; transform:translateY(-50%); z-index:10;
    width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid var(--border);
    color:var(--text); font-size:1.6rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .3s; backdrop-filter:blur(6px);
  }
  .nav-btn:hover { background:var(--indigo); border-color:var(--indigo); transform:translateY(-50%) scale(1.08); }
  .prev { left:24px; }
  .next { right:24px; }

  /* ===== 指示点 ===== */
  .dots { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10; }
  .dots button {
    width:10px; height:10px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.2); transition:all .35s;
  }
  .dots button.active { background:var(--cyan); width:30px; border-radius:12px; }

  /* ===== 进度条（顶部） ===== */
  .progress { position:absolute; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--indigo),var(--cyan)); transition:width .6s ease; z-index:11; }

  /* ===== 提示 ===== */
  .hint {
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%);
    color:var(--text-2); font-size:.82rem; letter-spacing:2px; white-space:nowrap;
    z-index:10; animation:bob 2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translate(-50%,0);opacity:.5} 50%{transform:translate(-50%,8px);opacity:1} }

  @media (max-width:768px){
    .slide h2{font-size:2rem} .slide .num{font-size:5rem} .nav-btn{width:44px;height:44px}
  }

  @media (prefers-reduced-motion: reduce){
    .slides{transition:none}
    *,*::before,*::after{animation-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="progress" id="progress" style="width:20%"></div>
  <div class="slides" id="slides">
    <div class="slide s1"><span class="num">01</span><div class="tag">INTRO</div><h2>全屏逐屏切换</h2><p>每一屏占满一屏，像演示文稿一样整屏切换。用滚轮、方向键或箭头按钮体验。</p></div>
    <div class="slide s2"><span class="num">02</span><div class="tag">FEEL</div><h2>整屏滑入</h2><p>屏与屏之间以顺滑的滑动过渡衔接，画面完整、不打断沉浸感。</p></div>
    <div class="slide s3"><span class="num">03</span><div class="tag">NAV</div><h2>多种导航方式</h2><p>滚轮 / 方向键 / 左右箭头 / 底部圆点，全部支持。</p></div>
    <div class="slide s4"><span class="num">04</span><div class="tag">STYLE</div><h2>每屏独立风格</h2><p>每屏可有自己的配色、背景与内容布局，适合做「介绍型」页面。</p></div>
    <div class="slide s5"><span class="num">05</span><div class="tag">NOTICE</div><h2>适合场景</h2><p>适合展示少量关键信息；内容多时体验受限，不建议长文页面使用。</p></div>
  </div>

  <button class="nav-btn prev" id="prevBtn" aria-label="上一屏">‹</button>
  <button class="nav-btn next" id="nextBtn" aria-label="下一屏">›</button>
  <div class="dots" id="dots"></div>
  <div class="hint">滚轮 / 方向键 / 箭头切换</div>
</div>

<script>
(function(){
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');
  const progressEl = document.getElementById('progress');
  const count = slidesEl.children.length;
  let cur = 0;

  for(let i=0;i<count;i++){
    const d=document.createElement('button');
    d.setAttribute('aria-label','第'+(i+1)+'屏');
    d.addEventListener('click',function(){ go(i); });
    dotsEl.appendChild(d);
  }
  const dots = dotsEl.querySelectorAll('button');

  function go(i){
    cur = Math.max(0, Math.min(count-1, i));
    slidesEl.style.transform = 'translateX(-' + cur*100 + 'vw)';
    dots.forEach(function(b,idx){ b.classList.toggle('active', idx===cur); });
    progressEl.style.width = ((cur+1)/count*100) + '%';
  }

  document.getElementById('nextBtn').addEventListener('click',function(){ go(cur+1); });
  document.getElementById('prevBtn').addEventListener('click',function(){ go(cur-1); });

  // 键盘
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown') go(cur+1);
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp') go(cur-1);
  });

  // 滚轮切换（整页禁止普通滚动）
  let lock = false;
  document.addEventListener('wheel',function(e){
    e.preventDefault();
    if(lock) return;
    if(Math.abs(e.deltaY) < 10) return;
    lock = true;
    go(e.deltaY > 0 ? cur+1 : cur-1);
    setTimeout(function(){ lock = false; }, 700);
  }, { passive:false });

  // 触摸滑动
  let tx = null;
  document.addEventListener('touchstart',function(e){ tx = e.touches[0].clientX; }, { passive:true });
  document.addEventListener('touchend',function(e){
    if(tx===null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx) > 50) go(dx < 0 ? cur+1 : cur-1);
    tx = null;
  }, { passive:true });

  go(0);
})();
</script>
</body>
</html>
